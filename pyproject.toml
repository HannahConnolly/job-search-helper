[project]
name = "job-search-helper"
version = "0.1.0"
description = "A LoopCV-style job search loop that ranks jobs against your resume and preps applications with Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "httpx2>=2.16",
    "markdownify>=1.2",
    "pydantic>=2.10",
    "python-jobspy>=1.4.1",
    "rich>=14",
    "typer>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
jobhelper = "jobhelper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhelper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
